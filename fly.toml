app = "services-miraki"
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  method = "GET"
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"

