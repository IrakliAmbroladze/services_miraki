# fly.toml app configuration file generated for services-miraki on 2026-11-22T09:20:54+04:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'services-miraki'
primary_region = 'fra'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
